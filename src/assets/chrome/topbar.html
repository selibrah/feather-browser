<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeatherBrowser TopBar</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: #16161a;
            color: #e2e2e8;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            font-size: 12px;
            display: flex;
            align-items: center;
            height: 40px;
            padding: 0 10px;
            border-bottom: 1px solid #282832;
            overflow: hidden;
        }

        .tab-strip {
            display: flex;
            align-items: center;
            gap: 5px;
            flex: 1;
            overflow-x: auto;
            overflow-y: hidden;
            height: 100%;
            scrollbar-width: none;
        }
        .tab-strip::-webkit-scrollbar {
            display: none;
        }

        .tab {
            display: flex;
            align-items: center;
            gap: 6px;
            height: 30px;
            padding: 0 10px;
            background: #202026;
            border: 1px solid #2e2e38;
            border-radius: 6px;
            max-width: 190px;
            min-width: 90px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, opacity 0.15s;
        }

        .tab:hover {
            background: #282832;
            border-color: #3e3e4c;
        }

        .tab.active {
            background: #2e2e3c;
            border-color: #63637e;
            color: #ffffff;
            font-weight: 500;
        }

        .tab.dormant {
            opacity: 0.7;
            border-style: dashed;
        }

        .tab-badge {
            font-size: 11px;
            line-height: 1;
            flex-shrink: 0;
        }

        .tab-title {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1;
        }

        .tab-close {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            color: #888;
            font-size: 13px;
            line-height: 1;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.15s, color 0.15s;
        }

        .tab-close:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .btn-action {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: transparent;
            border: 1px solid transparent;
            color: #a0a0b2;
            font-size: 14px;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }

        .btn-action:hover {
            background: #24242e;
            border-color: #383848;
            color: #ffffff;
        }

        .address-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            height: 28px;
            padding: 0 10px;
            background: #1b1b22;
            border: 1px solid #2d2d3a;
            border-radius: 6px;
            color: #8c8c9e;
            font-size: 11px;
            cursor: pointer;
            margin: 0 6px;
            max-width: 320px;
            min-width: 140px;
            flex-shrink: 1;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
        }

        .address-pill:hover {
            background: #242430;
            border-color: #444458;
            color: #e2e2ea;
        }

        .address-icon {
            font-size: 10px;
            flex-shrink: 0;
            color: #58a6ff;
        }

        .address-text {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1;
        }

        .address-shortcut {
            font-size: 10px;
            color: #55556a;
            background: #22222c;
            padding: 1px 4px;
            border-radius: 3px;
            flex-shrink: 0;
            border: 1px solid #2f2f3d;
        }

        /* WebKit's rule engine does not report individual blocked requests back to the
           host, so this shows what is verifiable: whether the rules are loaded, and how
           many. A per-request tally would have to be invented. */
        .shield {
            display: flex;
            align-items: center;
            gap: 5px;
            height: 28px;
            padding: 0 8px;
            border-radius: 6px;
            background: #1b1b22;
            border: 1px solid #2d2d3a;
            color: #4a4a5c;
            font-size: 11px;
            flex-shrink: 0;
            cursor: default;
            font-variant-numeric: tabular-nums;
        }

        .shield.active {
            color: #6fd3a0;
            border-color: #2c4a3c;
        }

        .shield-count {
            line-height: 1;
        }

        .tab-speaker {
            font-size: 10px;
            line-height: 1;
            cursor: pointer;
            opacity: 0.95;
            flex-shrink: 0;
        }
        .tab-speaker.muted { opacity: 0.45; }

        .tab-favicon {
            width: 13px;
            height: 13px;
            border-radius: 2px;
            display: block;
        }

        /* Zoom readout and download row: both hidden until they have something to say. */
        .status-pill {
            max-width: 420px;
            display: none;
            align-items: center;
            gap: 5px;
            height: 24px;
            padding: 0 8px;
            border-radius: 6px;
            background: #1a1a24;
            border: 1px solid #282834;
            color: #b9b9cc;
            font-size: 11px;
            flex-shrink: 0;
            white-space: nowrap;
            max-width: 220px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status-pill.show {
            display: flex;
        }

        .status-pill.ok {
            color: #6fd3a0;
            border-color: #2c4a3c;
        }

        .status-pill.fail {
            color: #e08585;
            border-color: #4a2c2c;
        }

        .btn-action.starred {
            color: #e5c04a;
        }

        .divider {
            width: 1px;
            height: 18px;
            background: #282834;
            margin: 0 4px;
            flex-shrink: 0;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-left: 6px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="tab-strip" id="tabStrip">
        <!-- Tabs rendered dynamically -->
    </div>

    <button class="btn-action" id="newTabBtn" title="New Tab (Cmd+T or 't')">+</button>
    <button class="btn-action" id="backBtn" title="Back (Cmd+[ or 'H')">‹</button>
    <button class="btn-action" id="fwdBtn" title="Forward (Cmd+] or 'L')">›</button>

    <div class="address-pill" id="addressPill" title="Click to Search or Enter URL (Cmd+L or 'o')">
        <span class="address-icon">🔒</span>
        <span class="address-text" id="addressText">Search DuckDuckGo or enter URL...</span>
        <span class="address-shortcut">⌘L</span>
    </div>

    <div class="status-pill" id="zoomPill" title="Zoom (Cmd+= / Cmd+- / Cmd+0)"></div>
    <div class="status-pill" id="downloadPill"></div>

    <div class="shield" id="shield" title="Filter lists not loaded. Run scripts/fetch-filter-lists.sh and restart.">
        <span>⛉</span><span class="shield-count" id="shieldCount">off</span>
    </div>

    <div class="divider"></div>

    <div class="controls">
        <button class="btn-action" id="omnibarBtn" title="Address Bar (Cmd+L or 'o')">🔍</button>
        <button class="btn-action" id="findBtn" title="Find in page (Cmd+F or '/')">🔎</button>
        <button class="btn-action" id="bookmarkBtn" title="Bookmark this page">☆</button>
        <button class="btn-action" id="videoBtn" title="Video controls (Alt+V)">⚡</button>
        <button class="btn-action" id="streamBtn" title="Stream health (Alt+S)">📶</button>
        <button class="btn-action" id="vimBtn" title="Vim keys on this site (off by default — bare j/k/f/t capture keystrokes)">⌨</button>
        <button class="btn-action" id="darkModeBtn" title="Dark mode on this site">🌓</button>
        <button class="btn-action" id="bionicBtn" title="Toggle Bionic Reading">📖</button>
        <button class="btn-action" id="fullscreenBtn" title="Full screen (Cmd+Ctrl+F or F11)">⛶</button>
    </div>

    <script>
        (function() {
            const tabStrip = document.getElementById('tabStrip');
            const newTabBtn = document.getElementById('newTabBtn');
            const addressPill = document.getElementById('addressPill');
            const addressText = document.getElementById('addressText');
            const omnibarBtn = document.getElementById('omnibarBtn');
            const darkModeBtn = document.getElementById('darkModeBtn');
            const vimBtn = document.getElementById('vimBtn');
            const bionicBtn = document.getElementById('bionicBtn');
            const shield = document.getElementById('shield');
            const shieldCount = document.getElementById('shieldCount');
            const backBtn = document.getElementById('backBtn');
            const fwdBtn = document.getElementById('fwdBtn');
            const findBtn = document.getElementById('findBtn');
            const bookmarkBtn = document.getElementById('bookmarkBtn');
            const videoBtn = document.getElementById('videoBtn');
            const streamBtn = document.getElementById('streamBtn');
            const zoomPill = document.getElementById('zoomPill');
            const downloadPill = document.getElementById('downloadPill');
            const fullscreenBtn = document.getElementById('fullscreenBtn');

            // Called from Rust once WebKit hands back a compiled rule list.
            window.__updateShield = function(count) {
                if (!count) { return; }
                shield.classList.add('active');
                shieldCount.textContent = count >= 1000
                    ? (count / 1000).toFixed(count >= 10000 ? 0 : 1) + 'k'
                    : String(count);
                shield.title = count.toLocaleString() + ' blocking rules active in WebKit';
            };

            function sendIpc(msg) {
                try {
                    if (window.ipc && typeof window.ipc.postMessage === 'function') {
                        window.ipc.postMessage(JSON.stringify(msg));
                    }
                } catch (e) {
                    console.error('[TopBar IPC Error]', e);
                }
            }

            newTabBtn.onclick = function() {
                sendIpc({ type: 'new_tab', url: 'https://example.com' });
            };

            addressPill.onclick = function() {
                sendIpc({ type: 'open_omnibar' });
            };

            omnibarBtn.onclick = function() {
                sendIpc({ type: 'open_omnibar' });
            };

            darkModeBtn.onclick = function() {
                sendIpc({ type: 'toggle_dark_mode' });
            };

            vimBtn.onclick = function() {
                sendIpc({ type: 'toggle_vim_keys' });
            };

            bionicBtn.onclick = function() {
                sendIpc({ type: 'toggle_bionic' });
            };

            fullscreenBtn.onclick = function() { sendIpc({ type: 'toggle_fullscreen' }); };
            backBtn.onclick = function() { sendIpc({ type: 'history_back' }); };
            fwdBtn.onclick = function() { sendIpc({ type: 'history_forward' }); };
            findBtn.onclick = function() { sendIpc({ type: 'open_find' }); };
            bookmarkBtn.onclick = function() { sendIpc({ type: 'toggle_bookmark' }); };
            videoBtn.onclick = function() { sendIpc({ type: 'toggle_video_panel' }); };
            streamBtn.onclick = function() { sendIpc({ type: 'toggle_stream_panel' }); };

            window.__updateBookmark = function(starred) {
                bookmarkBtn.textContent = starred ? '★' : '☆';
                bookmarkBtn.classList.toggle('starred', !!starred);
                bookmarkBtn.title = starred ? 'Remove bookmark' : 'Bookmark this page';
            };

            window.__updateZoom = function(percent) {
                zoomPill.textContent = percent + '%';
                zoomPill.classList.toggle('show', percent !== 100);
            };

            // wry reports a download starting and finishing, and nothing in between, so
            // this row is a state and not a bar.
            let downloadTimer = null;
            window.__download = function(name, state) {
                if (downloadTimer) clearTimeout(downloadTimer);
                downloadPill.classList.add('show');
                downloadPill.classList.remove('ok', 'fail');
                if (state === 'start') {
                    downloadPill.textContent = '⬇ ' + name;
                } else {
                    downloadPill.textContent = (state === 'ok' ? '✓ ' : '✕ ') + name;
                    downloadPill.classList.add(state === 'ok' ? 'ok' : 'fail');
                    downloadTimer = setTimeout(function() {
                        downloadPill.classList.remove('show');
                    }, 6000);
                }
                downloadPill.title = downloadPill.textContent;
            };

            // Progress arrives as absolute bytes. A percentage needs a total the server was
            // willing to state; without one, the bytes so far are still worth showing.
            window.__downloadProgress = function(name, done, total, bps) {
                if (!downloadPill.classList.contains('show')) return;
                if (downloadPill.classList.contains('ok') || downloadPill.classList.contains('fail')) return;
                const short = name.length > 22 ? name.slice(0, 21) + '\u2026' : name;
                let text = '\u2b07 ' + short + '  ' + fmtBytes(done);
                if (total > 0) {
                    const pct = Math.min(100, Math.round((done / total) * 100));
                    text = '\u2b07 ' + short + '  ' + pct + '%  ' + bar(pct);
                    if (bps > 0) {
                        const left = Math.max(0, Math.round((total - done) / bps));
                        text += '  ' + fmtRate(bps) + '  ' + fmtEta(left);
                    }
                } else if (bps > 0) {
                    text += '  ' + fmtRate(bps);
                }
                downloadPill.textContent = text;
                downloadPill.title = name + ' \u2014 ' + fmtBytes(done)
                    + (total ? ' of ' + fmtBytes(total) : '');
            };

            function bar(pct) {
                const cells = 10, filled = Math.round((pct / 100) * cells);
                return '\u2593'.repeat(filled) + '\u2591'.repeat(cells - filled);
            }
            function fmtBytes(n) {
                if (n > 1073741824) return (n / 1073741824).toFixed(1) + ' GB';
                if (n > 1048576) return (n / 1048576).toFixed(1) + ' MB';
                if (n > 1024) return Math.round(n / 1024) + ' KB';
                return n + ' B';
            }
            function fmtRate(bps) { return fmtBytes(bps) + '/s'; }
            function fmtEta(s) {
                if (s >= 3600) return Math.floor(s / 3600) + 'h' + Math.floor((s % 3600) / 60) + 'm';
                if (s >= 60) return Math.floor(s / 60) + 'm' + (s % 60) + 's';
                return s + 's';
            }

            // ponytail: the site's own /favicon.ico, not its <link rel=icon>. Sites that
            // only declare the link tag fall back to the globe; reporting the tag over IPC
            // is the upgrade if that turns out to be common.
            function faviconFor(url) {
                try {
                    const u = new URL(url);
                    if (u.protocol !== 'http:' && u.protocol !== 'https:') return null;
                    return u.origin + '/favicon.ico';
                } catch (_) {
                    return null;
                }
            }

            window.__updateTabs = function(tabs) {
                tabStrip.innerHTML = '';
                if (!Array.isArray(tabs)) return;

                const activeTab = tabs.find(t => t.is_active);
                if (activeTab && activeTab.url) {
                    try {
                        const parsed = new URL(activeTab.url);
                        addressText.textContent = parsed.hostname + (parsed.pathname !== '/' ? parsed.pathname : '');
                    } catch (_) {
                        addressText.textContent = activeTab.url;
                    }
                } else {
                    addressText.textContent = 'Search DuckDuckGo or enter URL...';
                }

                tabs.forEach((tab, index) => {
                    const tabEl = document.createElement('div');
                    tabEl.className = 'tab' + (tab.is_active ? ' active' : '') + (tab.is_dormant ? ' dormant' : '');
                    tabEl.title = tab.title + '\n' + tab.url + (tab.is_dormant ? ' (Hibernated in SQLite - 0 MB RAM)' : '');

                    const badge = document.createElement('span');
                    badge.className = 'tab-badge';
                    // Dormant tabs keep their favicon: the dashed border and the dimming
                    // already say hibernated, and a strip of moons is the unreadable case
                    // this replaced.
                    const iconUrl = faviconFor(tab.url);
                    if (iconUrl) {
                        const img = document.createElement('img');
                        img.className = 'tab-favicon';
                        img.src = iconUrl;
                        if (tab.is_dormant) img.style.filter = 'grayscale(1)';
                        img.onerror = function() {
                            badge.textContent = '🌐';
                        };
                        badge.appendChild(img);
                    } else {
                        badge.textContent = tab.is_dormant ? '🌙' : '🌐';
                    }

                    const title = document.createElement('span');
                    title.className = 'tab-title';
                    title.textContent = (index + 1) + '. ' + (tab.title || 'Tab');

                    // A playing tab gets a speaker you can click to silence, which is the
                    // only way to find the tab that started making noise on its own.
                    let speaker = null;
                    if (tab.playing) {
                        speaker = document.createElement('span');
                        speaker.className = 'tab-speaker' + (tab.muted ? ' muted' : '');
                        speaker.textContent = tab.muted ? '🔇' : '🔊';
                        speaker.title = tab.muted ? 'Unmute this tab' : 'Mute this tab';
                        speaker.onclick = function(e) {
                            e.stopPropagation();
                            sendIpc({ type: 'toggle_tab_muted', id: tab.id });
                        };
                    }

                    const closeBtn = document.createElement('span');
                    closeBtn.className = 'tab-close';
                    closeBtn.textContent = '×';
                    closeBtn.title = 'Close Tab (Cmd+W)';
                    closeBtn.onclick = function(e) {
                        e.stopPropagation();
                        sendIpc({ type: 'close_tab', id: tab.id });
                    };

                    tabEl.onclick = function() {
                        sendIpc({ type: 'switch_tab', id: tab.id });
                    };

                    tabEl.appendChild(badge);
                    tabEl.appendChild(title);
                    if (speaker) tabEl.appendChild(speaker);
                    tabEl.appendChild(closeBtn);
                    tabStrip.appendChild(tabEl);
                });
            };

            window.addEventListener('keydown', function(e) {
                if (e.key === 'F11') {
                    sendIpc({ type: 'toggle_fullscreen' });
                    e.preventDefault();
                    return;
                }
                if (e.metaKey && e.ctrlKey && e.key.toLowerCase() === 'f') {
                    sendIpc({ type: 'toggle_fullscreen' });
                    e.preventDefault();
                    return;
                }
                if (e.metaKey || e.ctrlKey) {
                    const key = e.key.toLowerCase();
                    if ((e.metaKey && key === 't') || (e.ctrlKey && key === 't')) {
                        sendIpc({ type: 'new_tab', url: 'https://example.com' });
                        e.preventDefault();
                    } else if ((e.metaKey && key === 'w') || (e.ctrlKey && key === 'w')) {
                        sendIpc({ type: 'close_current_tab' });
                        e.preventDefault();
                    } else if (e.ctrlKey && e.key === 'Tab') {
                        sendIpc({ type: e.shiftKey ? 'prev_tab' : 'next_tab' });
                        e.preventDefault();
                    } else if (e.metaKey && e.key >= '1' && e.key <= '9') {
                        const idx = parseInt(e.key, 10) - 1;
                        sendIpc({ type: 'switch_tab_index', index: idx });
                        e.preventDefault();
                    } else if (e.key === '[') {
                        sendIpc({ type: 'history_back' });
                        e.preventDefault();
                    } else if (e.key === ']') {
                        sendIpc({ type: 'history_forward' });
                        e.preventDefault();
                    } else if (key === 'f') {
                        sendIpc({ type: 'open_find' });
                        e.preventDefault();
                    } else if (e.key === '0' || e.key === '-' || e.key === '=' || e.key === '+') {
                        sendIpc({ type: 'zoom', step: e.key === '0' ? 0 : (e.key === '-' ? -1 : 1) });
                        e.preventDefault();
                    }
                }
            });
        })();
    </script>
</body>
</html>
