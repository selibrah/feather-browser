[package]
name = "feather-browser"
version = "0.1.0"
edition = "2021"
authors = ["FeatherBrowser Engineering Team"]
description = "Deterministic low-memory browser engine with tab suspension, adblocking, and zero-dependency client runtime"

[dependencies]
# "fullscreen" enables WKWebView element fullscreen, which is what a <video>
# fullscreen button calls. Off in wry by default.
wry = { version = "0.47", features = ["fullscreen"] }
winit = { version = "0.30", features = ["rwh_06"] }
adblock = { version = "0.8", features = ["content-blocking"] }
rusqlite = { version = "0.31", features = ["bundled"] }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
log = "0.4"
env_logger = "0.11"
thiserror = "1.0"
libc = "0.2"

[dev-dependencies]
tempfile = "3.10"

# Attaching WebKit content rules needs the WKContentRuleListStore bridge. These are all
# already in the tree via wry; pinning them here just makes them directly reachable.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.5"
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSString", "NSError", "NSURL"] }
# NSSavePanel is the download destination prompt. Already compiled as a wry dependency.
objc2-app-kit = { version = "0.2", features = ["NSSavePanel", "NSPanel", "NSWindow", "NSResponder", "NSView", "NSApplication"] }
objc2-web-kit = { version = "0.2", features = [
  "block2",
  "WKContentRuleList",
  "WKContentRuleListStore",
  "WKUserContentController",
] }
